# Every monster's Level is multiplied by 10 here. status_calc_misc now
# divides level by 10 (effective level) for HIT/FLEE, for both players
# and monsters, to keep DEX/AGI meaningful at level 999 instead of raw
# level swamping the formula. This file compensates so monsters land
# back on their original effective level after that division.
# Generated by gen_mob_level_scale.py from db/pre-re/mob_db.yml -- do
# not hand-edit scaled values, regenerate instead if base levels change.
###########################################################################

